<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Счётчик упоминаний 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffe3f1;
    --bg2: #ffd0e8;
    --card: rgba(255, 255, 255, 0.82);
    --pink: #ff6fae;
    --pink-dark: #e0478f;
    --pink-soft: #ffc2df;
    --purple: #b57bff;
    --text: #6b2a4f;
    --muted: #b07a98;
    --shadow: 0 8px 24px rgba(255, 111, 174, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Comfortaa', 'Segoe UI', sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #f3d9ff);
    overflow-x: hidden;
  }
  /* плавающие сердечки на фоне */
  .hearts-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .hearts-bg span {
    position: absolute; bottom: -40px; font-size: 22px; opacity: .55;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: .6; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  .wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 {
    text-align: center; margin: 6px 0 4px; font-size: 26px; color: var(--pink-dark);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 var(--pink-soft);
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .card {
    background: var(--card); border-radius: 24px; padding: 16px;
    box-shadow: var(--shadow); border: 2px solid #fff; backdrop-filter: blur(6px);
    margin-bottom: 16px;
  }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head h2 { margin: 0; font-size: 18px; text-transform: capitalize; }
  .nav-btn {
    border: none; background: var(--pink-soft); color: var(--pink-dark);
    width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer;
    font-family: inherit; transition: transform .15s;
  }
  .nav-btn:hover { transform: scale(1.1); }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; padding-bottom: 4px; }
  .day {
    position: relative; aspect-ratio: 1; border-radius: 14px; border: 2px solid transparent;
    background: #fff5fa; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; font-family: inherit; font-size: 14px; color: var(--text); padding: 0;
    transition: transform .12s, background .2s;
  }
  .day:hover { transform: scale(1.06); background: #ffe6f2; }
  .day.empty { visibility: hidden; }
  .day.today { border-color: var(--pink); }
  .day.selected { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; }
  .day .dots { font-size: 9px; line-height: 1; margin-top: 2px; min-height: 9px; }

  /* модалка с кнопками */
  .modal-back {
    position: fixed; inset: 0; background: rgba(107, 42, 79, .25); z-index: 10;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-back.open { display: flex; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff; border-radius: 28px; padding: 22px 18px; width: 100%; max-width: 360px;
    box-shadow: 0 16px 40px rgba(224, 71, 143, .35); border: 3px solid var(--pink-soft);
    text-align: center; animation: pop .25s cubic-bezier(.3,1.6,.6,1);
  }
  @keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }
  .modal h3 { margin: 0 0 4px; color: var(--pink-dark); }
  .modal .date-label { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .big-btn {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    border: none; border-radius: 18px; padding: 14px 16px; margin-bottom: 10px;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.12); transition: transform .1s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: none; }
  .btn-stepa { background: linear-gradient(135deg, #ff6fae, #ff8fc4); }
  .btn-femboy { background: linear-gradient(135deg, #b57bff, #d6a8ff); }
  .big-btn .count {
    background: rgba(255,255,255,.3); border-radius: 12px; padding: 4px 10px; min-width: 36px;
  }
  .undo-row { display: flex; gap: 8px; margin-top: 4px; }
  .undo-row button {
    flex: 1; border: 2px dashed var(--pink-soft); background: none; border-radius: 14px;
    padding: 8px; font-family: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .close-btn {
    margin-top: 12px; border: none; background: none; color: var(--pink-dark);
    font-family: inherit; font-size: 14px; cursor: pointer; text-decoration: underline;
  }

  /* статистика */
  .stats h2 { margin: 0 0 12px; font-size: 18px; text-align: center; }
  .stats table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
  .stats th { font-size: 12px; color: var(--muted); font-weight: 700; padding: 0 4px; }
  .stats td { background: #fff5fa; padding: 10px 6px; text-align: center; font-weight: 700; font-size: 18px; }
  .stats td:first-child { text-align: left; font-size: 13px; border-radius: 14px 0 0 14px; padding-left: 12px; }
  .stats td:last-child { border-radius: 0 14px 14px 0; }
  .stats .stepa td:first-child { color: var(--pink-dark); }
  .stats .femboy td:first-child { color: var(--purple); }
  .stats-note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* вылетающее сердечко при клике */
  .burst {
    position: fixed; pointer-events: none; z-index: 20; font-size: 24px;
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0,0) scale(.6); opacity: 1; }
    100% { transform: translate(var(--dx), -120px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>
<div class="hearts-bg" id="heartsBg"></div>

<div class="wrap">
  <h1>💗 Счётчик упоминаний 💗</h1>
  <div class="subtitle">(｡♥‿♥｡) нажми на дату, чтобы отметить</div>

  <div class="card">
    <div class="cal-head">
      <button class="nav-btn" id="prev">‹</button>
      <h2 id="monthTitle"></h2>
      <button class="nav-btn" id="next">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="card stats">
    <h2>✨ Статистика ✨</h2>
    <table>
      <thead><tr><th></th><th id="thDay">День</th><th id="thMonth">Месяц</th><th>Всего</th></tr></thead>
      <tbody>
        <tr class="stepa"><td>💖 Степа</td><td id="sDay"></td><td id="sMonth"></td><td id="sTotal"></td></tr>
        <tr class="femboy"><td>🎀 Фембои</td><td id="fDay"></td><td id="fMonth"></td><td id="fTotal"></td></tr>
      </tbody>
    </table>
    <div class="stats-note" id="statsNote"></div>
  </div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3>Кто сегодня? (≧◡≦)</h3>
    <div class="date-label" id="modalDate"></div>
    <button class="big-btn btn-stepa" id="addStepa"><span>💖 Упомянула Степу</span><span class="count" id="mStepa">0</span></button>
    <button class="big-btn btn-femboy" id="addFemboy"><span>🎀 Упомянула фембоев</span><span class="count" id="mFemboy">0</span></button>
    <div class="undo-row">
      <button id="undoStepa">− Степа</button>
      <button id="undoFemboy">− Фембои</button>
    </div>
    <button class="close-btn" id="closeModal">закрыть ♡</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'mentions-v1';
  const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  // data: { "2026-11-25": { stepa: 2, femboy: 1 } }
  let data = {};
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { data = {}; }
  const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {} };

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selected = keyOf(today.getFullYear(), today.getMonth(), today.getDate());

  function keyOf(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return { y, m: m - 1, d }; }
  const get = (k) => data[k] || { stepa: 0, femboy: 0 };

  function renderCalendar() {
    document.getElementById('monthTitle').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => {
      const el = document.createElement('div'); el.className = 'dow'; el.textContent = d; grid.appendChild(el);
    });
    const first = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7; // понедельник = 0
    const days = new Date(viewYear, viewMonth + 1, 0).getDate();
    for (let i = 0; i < first; i++) {
      const el = document.createElement('div'); el.className = 'day empty'; grid.appendChild(el);
    }
    const todayKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
    for (let d = 1; d <= days; d++) {
      const k = keyOf(viewYear, viewMonth, d);
      const v = get(k);
      const btn = document.createElement('button');
      btn.className = 'day' + (k === todayKey ? ' today' : '') + (k === selected ? ' selected' : '');
      btn.innerHTML = `<span>${d}</span><span class="dots">${v.stepa ? '💖' : ''}${v.femboy ? '🎀' : ''}</span>`;
      btn.onclick = () => openModal(k);
      grid.appendChild(btn);
    }
  }

  function renderStats() {
    const sel = parseKey(selected);
    const monthPrefix = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}`;
    let ms = 0, mf = 0, ts = 0, tf = 0;
    for (const [k, v] of Object.entries(data)) {
      ts += v.stepa; tf += v.femboy;
      if (k.startsWith(monthPrefix)) { ms += v.stepa; mf += v.femboy; }
    }
    const day = get(selected);
    document.getElementById('sDay').textContent = day.stepa;
    document.getElementById('fDay').textContent = day.femboy;
    document.getElementById('sMonth').textContent = ms;
    document.getElementById('fMonth').textContent = mf;
    document.getElementById('sTotal').textContent = ts;
    document.getElementById('fTotal').textContent = tf;
    document.getElementById('thDay').textContent = `${sel.d} ${MONTHS_GEN[sel.m].slice(0, 3)}`;
    document.getElementById('thMonth').textContent = MONTHS[viewMonth].slice(0, 3);
    document.getElementById('statsNote').textContent = `день — выбранная дата, месяц — ${MONTHS[viewMonth]} ${viewYear}`;
  }

  function render() { renderCalendar(); renderStats(); }

  function openModal(k) {
    selected = k;
    const { y, m, d } = parseKey(k);
    document.getElementById('modalDate').textContent = `${d} ${MONTHS_GEN[m]} ${y}`;
    updateModal();
    document.getElementById('modalBack').classList.add('open');
    render();
  }
  function updateModal() {
    const v = get(selected);
    document.getElementById('mStepa').textContent = v.stepa;
    document.getElementById('mFemboy').textContent = v.femboy;
  }
  function change(type, delta, ev) {
    const v = { ...get(selected) };
    v[type] = Math.max(0, v[type] + delta);
    if (v.stepa === 0 && v.femboy === 0) delete data[selected]; else data[selected] = v;
    save(); updateModal(); render();
    if (delta > 0 && ev) burst(ev.clientX, ev.clientY, type === 'stepa' ? '💖' : '🎀');
  }
  function burst(x, y, emoji) {
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('span');
      s.className = 'burst';
      s.textContent = i % 2 ? emoji : '💕';
      s.style.left = (x - 12) + 'px';
      s.style.top = (y - 12) + 'px';
      s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      s.style.animationDelay = (i * 40) + 'ms';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    }
  }

  document.getElementById('addStepa').onclick = (e) => change('stepa', 1, e);
  document.getElementById('addFemboy').onclick = (e) => change('femboy', 1, e);
  document.getElementById('undoStepa').onclick = () => change('stepa', -1);
  document.getElementById('undoFemboy').onclick = () => change('femboy', -1);
  document.getElementById('closeModal').onclick = () => document.getElementById('modalBack').classList.remove('open');
  document.getElementById('modalBack').onclick = (e) => { if (e.target.id === 'modalBack') e.target.classList.remove('open'); };
  // для кнопки «Назад» в Android-приложении
  window.closeModalIfOpen = () => {
    const m = document.getElementById('modalBack');
    if (!m.classList.contains('open')) return false;
    m.classList.remove('open');
    return true;
  };
  document.getElementById('prev').onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render(); };
  document.getElementById('next').onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render(); };

  // фоновые сердечки
  const bg = document.getElementById('heartsBg');
  const pool = ['💗','💕','💖','🩷','♡','🌸'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.textContent = pool[i % pool.length];
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (14 + Math.random() * 20) + 'px';
    s.style.animationDuration = (10 + Math.random() * 12) + 's';
    s.style.animationDelay = (-Math.random() * 20) + 's';
    bg.appendChild(s);
  }

  render();
</script>
</body>
</html>
